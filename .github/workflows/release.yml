name: Autobuild macOS Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build and test
        run: |
          npm ci
          npm test
          npm run lint
          APP_REVISION="$GITHUB_SHA" npm run app
      - name: Package and verify app
        run: |
          app='.build/app/Perpetual Radar.app'
          test -x "$app/Contents/MacOS/PerpetualRadar"
          test -s "$app/Contents/Resources/Assets.car"
          test "$(cat "$app/Contents/PkgInfo")" = 'APPL????'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.perpetualradar.macos
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = AppIcon
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSourceRevision' "$app/Contents/Info.plist")" = "$GITHUB_SHA"
          tar -cf Perpetual.Radar.app.tar -C .build/app 'Perpetual Radar.app'
          tar -tf Perpetual.Radar.app.tar | grep -qx 'Perpetual Radar.app/Contents/MacOS/PerpetualRadar'
          sha256="$(shasum -a 256 Perpetual.Radar.app.tar | cut -d' ' -f1)"
          versioned_asset="Perpetual.Radar.app.${GITHUB_SHA}.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          cp Perpetual.Radar.app.tar "$versioned_asset"
          printf '{"revision":"%s","asset_url":"https://github.com/notCorwin/Perpetual-Radar/releases/download/autobuild/Perpetual.Radar.app.tar","versioned_asset_url":"https://github.com/notCorwin/Perpetual-Radar/releases/download/autobuild/%s","digest":"sha256:%s","published_at":"%s"}\n' \
            "$GITHUB_SHA" "$versioned_asset" "$sha256" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > update.json
      - name: Publish autobuild release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view autobuild >/dev/null 2>&1; then
            gh release create autobuild --target "$GITHUB_SHA" --title autobuild --latest \
              --notes "Built from commit $GITHUB_SHA."
          fi
          versioned_asset="Perpetual.Radar.app.${GITHUB_SHA}.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          gh release upload autobuild "$versioned_asset"
          gh release upload autobuild 'Perpetual.Radar.app.tar#Perpetual Radar.app' --clobber
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" \
            --jq '[.assets[] | select(.name == "Perpetual.Radar.app.tar")] | .[0].digest')"
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$digest" == "sha256:$(shasum -a 256 Perpetual.Radar.app.tar | cut -d' ' -f1)" ]]
          versioned_digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" \
            --jq "[.assets[] | select(.name == \"$versioned_asset\")] | .[0].digest")"
          [[ "$versioned_digest" == "$digest" ]]
          gh release upload autobuild update.json --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/autobuild" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit autobuild --target "$GITHUB_SHA" --title autobuild --latest \
            --notes "Built from commit $GITHUB_SHA."
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" --jq .id)"
          cutoff="$(date -u -v-7d '+%Y-%m-%dT%H:%M:%SZ')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --paginate |
            jq -r --arg cutoff "$cutoff" '.[] | select(.name | test("^Perpetual[.]Radar[.]app[.][0-9a-f]{40}[.][0-9]+-[0-9]+[.]tar$")) | select(.created_at < $cutoff) | .id' |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            done
