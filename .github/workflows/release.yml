name: Autobuild macOS Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build and test
        run: |
          npm ci
          npm test
          npm run lint
          APP_REVISION="$GITHUB_SHA" npm run app
      - name: Package and verify app
        run: |
          app='.build/app/Perpetual Radar.app'
          test -x "$app/Contents/MacOS/PerpetualRadar"
          test -s "$app/Contents/Resources/Assets.car"
          test "$(cat "$app/Contents/PkgInfo")" = 'APPL????'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.perpetualradar.macos
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = AppIcon
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSourceRevision' "$app/Contents/Info.plist")" = "$GITHUB_SHA"
          tar -cf Perpetual.Radar.app.tar -C .build/app 'Perpetual Radar.app'
          tar -tf Perpetual.Radar.app.tar | grep -qx 'Perpetual Radar.app/Contents/MacOS/PerpetualRadar'
          sha256="$(shasum -a 256 Perpetual.Radar.app.tar | cut -d' ' -f1)"
          printf '{"revision":"%s","asset_url":"https://github.com/notCorwin/Perpetual-Radar/releases/download/autobuild/Perpetual.Radar.app.tar","digest":"sha256:%s","published_at":"%s"}\n' \
            "$GITHUB_SHA" "$sha256" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > update.json
      - name: Replace autobuild release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete autobuild --yes --cleanup-tag 2>/dev/null || true
          gh release create autobuild 'Perpetual.Radar.app.tar#Perpetual Radar.app' update.json \
            --target "$GITHUB_SHA" --title autobuild --latest \
            --notes "Built from commit $GITHUB_SHA."
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" \
            --jq '[.assets[] | select(.name == "Perpetual.Radar.app.tar")] | .[0].digest')"
          [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          [[ "$digest" == "sha256:$(shasum -a 256 Perpetual.Radar.app.tar | cut -d' ' -f1)" ]]
