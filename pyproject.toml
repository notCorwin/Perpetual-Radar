[project]
name = "perp-radar-backend"
version = "0.1.0"
requires-python = ">=3.14.7,<3.15"
dependencies = ["aiohttp>=3.13,<4"]

[project.scripts]
perp-radar = "backend.radar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "watchfiles>=1.3.0",
]
